<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 55 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Git-Mastery Desktop architecture before AI features</title>
  <desc id="desc">Before AI features, the learner interface provided lessons and a terminal. Approved operations crossed a typed IPC boundary to the Electron main process, which worked with the Git-Mastery CLI and exercise folders.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#26332d"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17221d; }
      .heading { font-size: 24px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 600; }
      .small { font-size: 15px; fill: #526159; }
      .box { fill: #ffffff; stroke: #617168; stroke-width: 2; rx: 10; }
      .line { fill: none; stroke: #26332d; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="500" fill="#ffffff"/>
  <rect x="170" y="70" width="730" height="390" rx="18" fill="#f7faf8" stroke="#415149" stroke-width="3"/>
  <text x="200" y="108" class="label">Local machine</text>

  <rect x="220" y="125" width="400" height="300" rx="16" fill="#ffffff" stroke="#2f8a57" stroke-width="3"/>
  <text x="420" y="158" text-anchor="middle" class="label">Git-Mastery Desktop</text>

  <rect x="265" y="180" width="310" height="66" class="box"/>
  <text x="420" y="207" text-anchor="middle" class="label">Learner interface</text>
  <text x="420" y="230" text-anchor="middle" class="small">Lessons and terminal</text>

  <path d="M 420 246 L 420 270" class="line"/>
  <rect x="265" y="270" width="310" height="52" class="box"/>
  <text x="420" y="302" text-anchor="middle" class="label">Typed IPC boundary</text>

  <path d="M 420 322 L 420 345" class="line"/>
  <rect x="265" y="345" width="310" height="58" class="box"/>
  <text x="420" y="372" text-anchor="middle" class="label">Electron main process</text>
  <text x="420" y="393" text-anchor="middle" class="small">Local operations and saved state</text>

  <rect x="670" y="155" width="180" height="78" class="box"/>
  <text x="760" y="188" text-anchor="middle" class="label">Git-Mastery CLI</text>
  <text x="760" y="212" text-anchor="middle" class="small">Start and Verify</text>

  <rect x="670" y="320" width="180" height="78" class="box"/>
  <text x="760" y="353" text-anchor="middle" class="label">Exercise folders</text>
  <text x="760" y="377" text-anchor="middle" class="small">Git repositories</text>

  <path d="M 575 374 C 625 374, 620 194, 670 194" class="line"/>
  <path d="M 575 388 C 620 388, 625 359, 670 359" class="line"/>
  <path d="M 760 233 L 760 320" class="line"/>

  <rect x="25" y="225" width="105" height="70" class="box"/>
  <text x="77" y="267" text-anchor="middle" class="label">Learner</text>
  <path d="M 130 260 C 175 260, 205 213, 265 213" class="line"/>

  <rect x="960" y="155" width="200" height="78" class="box"/>
  <text x="1060" y="188" text-anchor="middle" class="label">Lesson website</text>
  <text x="1060" y="212" text-anchor="middle" class="small">git-mastery.org</text>
  <path d="M 900 194 L 960 194" class="line"/>
</svg>
