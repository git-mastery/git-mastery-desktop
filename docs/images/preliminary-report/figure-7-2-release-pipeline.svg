<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Actions release pipeline</title>
  <desc id="desc">A manual release passes through checks and versioning, builds four platform packages in parallel, and publishes one GitHub Release.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#26332d"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17221d; }
      .label { font-size: 20px; font-weight: 700; }
      .small { font-size: 15px; fill: #526159; }
      .box { fill: #ffffff; stroke: #617168; stroke-width: 2; rx: 12; }
      .accent { fill: #edf7f0; stroke: #2f8a57; stroke-width: 2; rx: 12; }
      .platform { fill: #ffffff; stroke: #8a9891; stroke-width: 1.5; rx: 8; }
      .line { fill: none; stroke: #26332d; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="420" fill="#ffffff"/>

  <rect x="25" y="135" width="180" height="110" class="box"/>
  <text x="115" y="197" text-anchor="middle" class="label">Manual release</text>

  <path d="M 205 190 L 250 190" class="line"/>

  <rect x="250" y="135" width="175" height="110" class="accent"/>
  <text x="337" y="165" text-anchor="middle" class="label">Quality gate</text>
  <text x="337" y="197" text-anchor="middle" class="small">ESLint / Prettier</text>
  <text x="337" y="221" text-anchor="middle" class="small">TypeScript / Vitest</text>

  <path d="M 425 190 L 470 190" class="line"/>

  <rect x="470" y="135" width="175" height="110" class="box"/>
  <text x="557" y="165" text-anchor="middle" class="label">Version + tag</text>
  <text x="557" y="197" text-anchor="middle" class="small">semantic-release</text>
  <text x="557" y="221" text-anchor="middle" class="small">Commit + vX.Y.Z tag</text>

  <path d="M 645 190 L 690 190" class="line"/>

  <rect x="690" y="70" width="285" height="240" class="box"/>
  <text x="832" y="108" text-anchor="middle" class="label">Build in parallel</text>

  <rect x="720" y="135" width="105" height="58" class="platform"/>
  <text x="772" y="170" text-anchor="middle" class="small">macOS arm64</text>

  <rect x="840" y="135" width="105" height="58" class="platform"/>
  <text x="892" y="170" text-anchor="middle" class="small">macOS x64</text>

  <rect x="720" y="210" width="105" height="58" class="platform"/>
  <text x="772" y="245" text-anchor="middle" class="small">Windows x64</text>

  <rect x="840" y="210" width="105" height="58" class="platform"/>
  <text x="892" y="245" text-anchor="middle" class="small">Linux x64</text>

  <path d="M 975 190 L 1020 190" class="line"/>

  <rect x="1020" y="135" width="155" height="110" class="accent"/>
  <text x="1097" y="197" text-anchor="middle" class="label">Publish</text>
</svg>
