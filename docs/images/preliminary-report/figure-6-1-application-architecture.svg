<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Git-Mastery Desktop high-level architecture</title>
  <desc id="desc">A prominent local machine contains Git-Mastery Desktop, the Git-Mastery CLI, and exercise repositories. The desktop application separates its learner interface from the Electron main process with a typed IPC boundary and connects to the lesson website and an AI provider.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#26332d"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17221d; }
      .label { font-size: 20px; font-weight: 600; }
      .small { font-size: 16px; }
      .tiny { font-size: 14px; fill: #526159; }
      .box { fill: #ffffff; stroke: #617168; stroke-width: 2; rx: 12; }
      .accent { fill: #edf7f0; stroke: #2f8a57; stroke-width: 2; rx: 12; }
      .line { fill: none; stroke: #26332d; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="650" fill="#ffffff"/>

  <rect x="175" y="35" width="750" height="580" rx="20" fill="#f7faf8" stroke="#415149" stroke-width="3"/>
  <text x="210" y="76" class="label">Local machine</text>

  <rect x="225" y="105" width="390" height="455" rx="18" fill="#ffffff" stroke="#2f8a57" stroke-width="3"/>
  <text x="420" y="145" text-anchor="middle" class="label">Git-Mastery Desktop</text>

  <rect x="270" y="175" width="300" height="90" class="box"/>
  <text x="420" y="212" text-anchor="middle" class="label">Learner interface</text>
  <text x="420" y="238" text-anchor="middle" class="small">Lessons  /  AI Hints  /  terminal</text>

  <path d="M 420 265 L 420 300" class="line"/>
  <rect x="270" y="300" width="300" height="64" class="accent"/>
  <text x="420" y="328" text-anchor="middle" class="label">Typed IPC boundary</text>
  <text x="420" y="350" text-anchor="middle" class="tiny">Only approved operations cross</text>

  <path d="M 420 364 L 420 402" class="line"/>
  <rect x="270" y="402" width="300" height="105" class="box"/>
  <text x="420" y="442" text-anchor="middle" class="label">Electron main process</text>
  <text x="420" y="469" text-anchor="middle" class="small">Local operations  /  saved state</text>
  <text x="420" y="492" text-anchor="middle" class="small">Provider requests</text>

  <rect x="675" y="170" width="200" height="110" class="accent"/>
  <text x="775" y="212" text-anchor="middle" class="label">Git-Mastery CLI</text>
  <text x="775" y="240" text-anchor="middle" class="small">Start  /  Verify</text>

  <rect x="675" y="380" width="200" height="110" class="box"/>
  <text x="775" y="421" text-anchor="middle" class="label">Exercise folders</text>
  <text x="775" y="449" text-anchor="middle" class="small">Git repositories</text>

  <path d="M 570 452 C 620 452, 620 225, 675 225" class="line"/>
  <text x="650" y="325" text-anchor="middle" class="tiny">runs</text>

  <path d="M 775 280 L 775 380" class="line"/>
  <text x="792" y="336" class="tiny">uses</text>

  <path d="M 570 478 C 620 478, 625 435, 675 435" class="line"/>
  <text x="640" y="520" text-anchor="middle" class="tiny">reads</text>

  <rect x="25" y="270" width="115" height="85" class="box"/>
  <circle cx="82" cy="300" r="14" fill="#edf7f0" stroke="#2f8a57" stroke-width="2"/>
  <path d="M 54 339 C 58 316, 106 316, 110 339" fill="#edf7f0" stroke="#2f8a57" stroke-width="2"/>
  <text x="82" y="378" text-anchor="middle" class="small">Learner</text>
  <path d="M 140 312 L 225 312" class="line"/>

  <rect x="985" y="150" width="185" height="100" class="box"/>
  <text x="1077" y="192" text-anchor="middle" class="label">Lesson website</text>
  <text x="1077" y="220" text-anchor="middle" class="small">git-mastery.org</text>
  <path d="M 925 200 L 985 200" class="line"/>
  <text x="955" y="184" text-anchor="middle" class="tiny">content</text>

  <rect x="985" y="390" width="185" height="100" class="box"/>
  <text x="1077" y="432" text-anchor="middle" class="label">AI provider</text>
  <text x="1077" y="460" text-anchor="middle" class="small">Selected by learner</text>
  <path d="M 925 440 L 985 440" class="line"/>
  <text x="955" y="424" text-anchor="middle" class="tiny">requests</text>
</svg>
