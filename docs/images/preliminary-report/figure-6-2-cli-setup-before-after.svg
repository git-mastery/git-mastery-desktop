<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">Git-Mastery CLI setup before and after the change</title>
  <desc id="desc">Before the change, the curriculum and desktop app could install competing CLI copies. After the change, the curriculum owns setup and the desktop app reuses the single CLI on the system path.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#26332d"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17221d; }
      .heading { font-size: 24px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 600; }
      .small { font-size: 15px; fill: #526159; }
      .box { fill: #ffffff; stroke: #617168; stroke-width: 2; rx: 10; }
      .before { fill: #fff7f5; stroke: #b85c4b; stroke-width: 2; rx: 10; }
      .after { fill: #edf7f0; stroke: #2f8a57; stroke-width: 2; rx: 10; }
      .line { fill: none; stroke: #26332d; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="450" fill="#ffffff"/>

  <rect x="30" y="35" width="545" height="375" rx="18" fill="#fcfcfc" stroke="#c9cfcb" stroke-width="2"/>
  <text x="65" y="78" class="heading">Before: competing setup paths</text>

  <rect x="70" y="120" width="175" height="70" class="box"/>
  <text x="157" y="150" text-anchor="middle" class="label">Curriculum setup</text>
  <text x="157" y="174" text-anchor="middle" class="small">Learner installs CLI</text>

  <rect x="70" y="260" width="175" height="70" class="box"/>
  <text x="157" y="290" text-anchor="middle" class="label">Desktop setup</text>
  <text x="157" y="314" text-anchor="middle" class="small">App installs CLI</text>

  <path d="M 245 155 L 320 155" class="line"/>
  <path d="M 245 295 L 320 295" class="line"/>

  <rect x="320" y="120" width="165" height="70" class="before"/>
  <text x="402" y="150" text-anchor="middle" class="label">CLI copy A</text>
  <text x="402" y="174" text-anchor="middle" class="small">System PATH</text>

  <rect x="320" y="260" width="165" height="70" class="before"/>
  <text x="402" y="290" text-anchor="middle" class="label">CLI copy B</text>
  <text x="402" y="314" text-anchor="middle" class="small">App-managed path</text>

  <path d="M 485 155 C 530 155, 530 205, 530 218" class="line"/>
  <path d="M 485 295 C 530 295, 530 245, 530 232" class="line"/>
  <circle cx="530" cy="225" r="22" fill="#fff7f5" stroke="#b85c4b" stroke-width="2"/>
  <text x="530" y="233" text-anchor="middle" font-size="24" font-weight="700" fill="#9f3f31">?</text>

  <rect x="625" y="35" width="545" height="375" rx="18" fill="#f7faf8" stroke="#2f8a57" stroke-width="2"/>
  <text x="660" y="78" class="heading">After: one source of truth</text>

  <rect x="650" y="180" width="190" height="90" class="box"/>
  <text x="745" y="217" text-anchor="middle" class="label">Curriculum setup</text>
  <text x="745" y="244" text-anchor="middle" class="small">Owns installation</text>

  <path d="M 840 225 L 880 225" class="line"/>

  <rect x="880" y="165" width="220" height="120" class="after"/>
  <text x="990" y="205" text-anchor="middle" class="label">One Git-Mastery CLI</text>
  <text text-anchor="middle" class="small">
    <tspan x="990" y="238">Resolved from</tspan>
    <tspan x="990" y="260">system PATH</tspan>
  </text>

  <path d="M 990 285 L 990 315" class="line"/>
  <rect x="875" y="315" width="230" height="72" class="box"/>
  <text text-anchor="middle" class="label">
    <tspan x="990" y="344">Desktop checks</tspan>
    <tspan x="990" y="368">and reuses it</tspan>
  </text>
</svg>
