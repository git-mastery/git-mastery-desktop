<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Directory resolution before and after the change</title>
  <desc id="desc">Before the change, the app inferred the working directory from the number of subfolders and could silently choose the wrong folder when the layout changed. After the change, it reads the exact working directory from explicit metadata.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#26332d"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17221d; }
      .heading { font-size: 24px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 600; }
      .small { font-size: 15px; fill: #526159; }
      .code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 14px; fill: #526159; }
      .box { fill: #ffffff; stroke: #617168; stroke-width: 2; rx: 10; }
      .before { fill: #fff7f5; stroke: #b85c4b; stroke-width: 2; rx: 10; }
      .after { fill: #edf7f0; stroke: #2f8a57; stroke-width: 2; rx: 10; }
      .line { fill: none; stroke: #26332d; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="500" fill="#ffffff"/>

  <rect x="30" y="35" width="545" height="430" rx="18" fill="#fcfcfc" stroke="#c9cfcb" stroke-width="2"/>
  <text x="65" y="78" class="heading">Before: infer from folder shape</text>

  <rect x="105" y="100" width="395" height="58" class="box"/>
  <text x="302" y="136" text-anchor="middle" class="label">Where is this exercise?</text>

  <path d="M 302 158 L 302 185" class="line"/>

  <rect x="165" y="185" width="275" height="60" class="box"/>
  <text x="302" y="222" text-anchor="middle" class="label">Inspect folder structure</text>

  <path d="M 302 245 L 302 270" class="line"/>

  <rect x="130" y="270" width="345" height="112" class="before"/>
  <text text-anchor="middle" class="small">
    <tspan x="302" y="298">No subfolders: use workspace root</tspan>
    <tspan x="302" y="328">One subfolder: use that folder</tspan>
    <tspan x="302" y="358">Several subfolders: make further guesses</tspan>
  </text>

  <path d="M 302 382 L 302 402" class="line"/>

  <rect x="140" y="402" width="325" height="48" class="before"/>
  <text x="302" y="432" text-anchor="middle" class="label">Layout changes can alter the answer</text>

  <rect x="625" y="35" width="545" height="430" rx="18" fill="#f7faf8" stroke="#2f8a57" stroke-width="2"/>
  <text x="660" y="78" class="heading">After: use explicit metadata</text>

  <rect x="700" y="100" width="395" height="58" class="box"/>
  <text x="897" y="136" text-anchor="middle" class="label">Where is this exercise?</text>

  <path d="M 897 158 L 897 190" class="line"/>

  <rect x="755" y="190" width="285" height="100" class="box"/>
  <text x="897" y="224" text-anchor="middle" class="label">Read CLI manifest</text>
  <text x="897" y="258" text-anchor="middle" class="code">.gitmastery-exercise.json</text>

  <path d="M 897 290 L 897 330" class="line"/>

  <rect x="755" y="330" width="285" height="84" class="after"/>
  <text x="897" y="363" text-anchor="middle" class="label">Use recorded folder name</text>
  <text x="897" y="391" text-anchor="middle" class="small">Explicit and layout-independent</text>
</svg>
