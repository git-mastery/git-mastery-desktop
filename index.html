<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Git-Mastery</title>
    <script>
      (function () {
        var THEME_KEY = "gm-theme";
        var PREFS_KEY = "site-view-prefs";
        function isTheme(value) {
          return value === "light" || value === "dark";
        }
        function fromOs() {
          return window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        function stripLegacyTheme(parsed) {
          if (!parsed || typeof parsed !== "object" || !("theme" in parsed)) {
            return;
          }
          delete parsed.theme;
          try {
            localStorage.setItem(PREFS_KEY, JSON.stringify(parsed));
          } catch (e) {}
        }
        var theme = null;
        var parsedPrefs = null;
        try {
          var stored = localStorage.getItem(THEME_KEY);
          if (isTheme(stored)) theme = stored;
          var raw = localStorage.getItem(PREFS_KEY);
          if (raw) parsedPrefs = JSON.parse(raw);
          if (!theme && parsedPrefs)
            theme = isTheme(parsedPrefs.theme) ? parsedPrefs.theme : null;
        } catch (e) {}
        if (!theme) theme = fromOs();
        try {
          localStorage.setItem(THEME_KEY, theme);
        } catch (e) {}
        stripLegacyTheme(parsedPrefs);
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
